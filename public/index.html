<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LCC TT Reservation Scheduler</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<style>
			body {
				background-color: #18181b;
				color: #e4e4e7;
				font-family: 'Inter', sans-serif;
			}
			.form-select {
				background-color: #27272a;
				color: #a1a1aa;
				border: 1px solid #3f3f46;
			}
			.form-select:focus {
				border-color: #6366f1;
				box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
			}

			.nav-tabs .nav-link {
				color: #a1a1aa;
			}

			.nav-tabs .nav-link.active {
				color: #e4e4e7;
				background-color: #27272a;
			}

			.tab-content {
				background-color: #1f1f23;
				padding: 20px;
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
			}

			.input-group .form-control {
				background-color: #27272a;
				color: #a1a1aa;
				border: 1px solid #3f3f46;
			}

			.input-group .form-control:focus {
				border-color: #6366f1;
				box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
			}

			.input-group-text {
				background-color: #27272a;
				color: #a1a1aa;
				border: 1px solid #3f3f46;
				min-width: 100px;
			}

			.btn-primary {
				background-color: #6366f1;
			}

			.btn-primary:hover {
				background-color: #4f46e5;
			}

			.btn-secondary {
				background-color: #4ade80;
			}

			.btn-secondary:hover {
				background-color: #22c55e;
			}

			.btn-danger {
				background-color: #f87171;
			}

			.btn-danger:hover {
				background-color: #ef4444;
			}

			#logs-content {
				white-space: pre-wrap;
				font-family: 'Fira Code', monospace;
				font-size: 0.9rem;
				color: #a1a1aa;
				background-color: #1f1f23;
				padding: 10px;
				border-radius: 6px;
			}

			.input-group .form-control::placeholder {
				color: #a1a1aa;
				opacity: 1; /* Ensure full visibility */
			}

			.input-group .form-control:-ms-input-placeholder {
				color: #a1a1aa; /* For IE */
			}

			.input-group .form-control::-ms-input-placeholder {
				color: #a1a1aa; /* For Edge */
			}

			.alert-info {
				background-color: #1e3a8a;
				border-color: #3b82f6;
				color: #bfdbfe;
			}

			/* Pagination styling */
			.pagination .page-link {
				background-color: #27272a;
				border-color: #3f3f46;
				color: #a1a1aa;
			}

			.pagination .page-link:hover {
				background-color: #3f3f46;
				border-color: #6366f1;
				color: #e4e4e7;
			}

			.pagination .page-item.active .page-link {
				background-color: #6366f1;
				border-color: #6366f1;
				color: #ffffff;
			}

			.pagination .page-item.disabled .page-link {
				background-color: #1f1f23;
				border-color: #3f3f46;
				color: #6b7280;
			}
		</style>
	</head>
	<body>
		<header class="py-3 mb-4" style="background-color: #27272a">
			<div class="container text-center">
				<h1 style="color: #e4e4e7">LCC TT Reservation Scheduler</h1>
			</div>
		</header>
		<main class="container">
			<ul class="nav nav-tabs" id="tabs" role="tablist">
				<li class="nav-item" role="presentation">
					<button
						class="nav-link active"
						id="config-tab"
						data-bs-toggle="tab"
						data-bs-target="#config-tab-pane"
						type="button"
						role="tab"
						aria-controls="config-tab-pane"
						aria-selected="true"
					>
						Configure Tasks
					</button>
				</li>
				<li class="nav-item" role="presentation">
					<button
						class="nav-link"
						id="tasks-tab"
						data-bs-toggle="tab"
						data-bs-target="#tasks-tab-pane"
						type="button"
						role="tab"
						aria-controls="tasks-tab-pane"
						aria-selected="false"
					>
						Active Tasks
					</button>
				</li>
				<li class="nav-item" role="presentation">
					<button
						class="nav-link"
						id="logs-tab"
						data-bs-toggle="tab"
						data-bs-target="#logs-tab-pane"
						type="button"
						role="tab"
						aria-controls="logs-tab-pane"
						aria-selected="false"
					>
						Logs
					</button>
				</li>
			</ul>

			<div class="tab-content mt-3">
				<!-- Configure Tasks Tab -->
				<div
					class="tab-pane fade show active"
					id="config-tab-pane"
					role="tabpanel"
					aria-labelledby="config-tab"
				>
					<div class="mb-3">
						<h2>Configure and Manage Tasks</h2>
						<div class="alert alert-info mb-3">
							<strong>Booking Schedule:</strong><br />
							• <strong>Monday & Tuesday:</strong> 7PM-10PM<br />
							• <strong>Sunday:</strong> 12PM-5PM<br />
							• Other days are not available for booking
						</div>
						<form id="control-form">
							<div class="input-group mb-3">
								<span class="input-group-text">Date</span>
								<input type="date" class="form-control" id="date" name="date" required />
							</div>
							<div class="input-group mb-3">
								<span class="input-group-text">Time</span>
								<select class="form-select" id="hour" name="hour" required>
									<option value="">Select a time...</option>
									<optgroup label="Monday & Tuesday">
										<option value="76">7:00 PM</option>
										<option value="80">8:00 PM</option>
										<option value="84">9:00 PM</option>
										<option value="88">10:00 PM</option>
									</optgroup>
									<optgroup label="Sunday">
										<option value="48">12:00 PM</option>
										<option value="52">1:00 PM</option>
										<option value="56">2:00 PM</option>
										<option value="60">3:00 PM</option>
										<option value="64">4:00 PM</option>
										<option value="68">5:00 PM</option>
									</optgroup>
								</select>
							</div>
							<div class="input-group mb-3">
								<span class="input-group-text">Court</span>
								<select class="form-select" id="court" name="court" required>
									<option value="">Select a court...</option>
									<option value="1">Hall Tb 1</option>
									<option value="2">Hall Tb 2</option>
									<option value="3">Hall Tb 3</option>
									<option value="4">Hall Tb 4</option>
									<option value="5">Hall Tb 5</option>
									<option value="6">Hall Tb 6</option>
								</select>
							</div>
							<div class="input-group mb-3">
								<span class="input-group-text">Name</span>
								<input
									type="text"
									class="form-control"
									id="name"
									name="name"
									placeholder="Your Name"
									required
								/>
							</div>
							<div class="input-group mb-3">
								<span class="input-group-text">Recurring</span>
								<select class="form-select" id="recurring" name="recurring">
									<option value="false">No - One time booking</option>
									<option value="true">Yes - Weekly recurring</option>
								</select>
							</div>
							<div class="input-group mb-3">
								<span class="input-group-text">Task Key</span>
								<input
									type="text"
									class="form-control"
									id="taskKey"
									name="taskKey"
									placeholder="Only needed for stopping a task"
								/>
							</div>
							<div class="w-100 d-flex justify-content-center">
								<button type="button" class="btn btn-primary mb-1 w-100" onclick="startTask()">
									Start Task
								</button>
								<button type="button" class="btn btn-secondary mb-1 w-100" onclick="testTask()">
									Test Task
								</button>
								<button type="button" class="btn btn-danger mb-1 w-100" onclick="stopTask()">
									Stop Task
								</button>
							</div>
						</form>
					</div>
				</div>

				<!-- Active Tasks Tab -->
				<div class="tab-pane fade" id="tasks-tab-pane" role="tabpanel" aria-labelledby="tasks-tab">
					<h2>Active Tasks</h2>
					<ul id="tasks-list" class="list-group"></ul>
				</div>

				<!-- Logs Tab -->
				<div class="tab-pane fade" id="logs-tab-pane" role="tabpanel" aria-labelledby="logs-tab">
					<h2>Logs</h2>
					<div class="d-flex justify-content-between align-items-center mb-3">
						<div>
							<span id="logs-info" class="text-muted">Loading...</span>
						</div>
						<div>
							<button class="btn btn-sm btn-outline-secondary" onclick="refreshLogs()">
								<i class="bi bi-arrow-clockwise"></i> Refresh
							</button>
						</div>
					</div>
					<pre id="logs-content" class="bg-dark text-white p-3 rounded" style="min-height: 400px"></pre>

					<!-- Pagination Controls -->
					<nav aria-label="Logs pagination" id="logs-pagination-nav" style="display: none">
						<ul class="pagination justify-content-center" id="logs-pagination">
							<!-- Pagination items will be dynamically generated -->
						</ul>
					</nav>
				</div>
			</div>
		</main>
		<!-- Toast Container -->
		<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			// Hour to time mapping for display
			const hourToTime = {
				76: '7:00 PM',
				80: '8:00 PM',
				84: '9:00 PM',
				88: '10:00 PM',
				48: '12:00 PM',
				52: '1:00 PM',
				56: '2:00 PM',
				60: '3:00 PM',
				64: '4:00 PM',
				68: '5:00 PM',
			};

			// Auto-generate emailInfo when court or hour changes
			function updateEmailInfo() {
				const court = document.getElementById('court').value;
				const hour = document.getElementById('hour').value;

				if (court && hour && hourToTime[hour]) {
					const emailInfo = `Hall Tb ${court} at ${hourToTime[hour]}`;
					// We'll add this as a hidden field or auto-generate it when submitting
				}
			}

			// Add event listeners for auto-updating
			document.getElementById('court').addEventListener('change', updateEmailInfo);
			document.getElementById('hour').addEventListener('change', updateEmailInfo);

			// Utility to show toast
			function showToast(message, type = 'info') {
				const toastContainer = document.getElementById('toastContainer');
				const toast = document.createElement('div');
				toast.className = `toast align-items-center text-bg-${type} border-0`;
				toast.setAttribute('role', 'alert');
				toast.setAttribute('aria-live', 'assertive');
				toast.setAttribute('aria-atomic', 'true');

				toast.innerHTML = `
				<div class="d-flex">
					<div class="toast-body">${message}</div>
					<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
				</div>
			`;

				toastContainer.appendChild(toast);

				const bsToast = new bootstrap.Toast(toast);
				bsToast.show();

				// Remove the toast after it's hidden
				toast.addEventListener('hidden.bs.toast', () => {
					toast.remove();
				});
			}

			// Simplified validation for booking days and times
			function validateBooking(date, hour) {
				const bookingDate = new Date(date);
				const dayOfWeek = bookingDate.getDay(); // 0 = Sunday, 1 = Monday, 2 = Tuesday, etc.
				const hourNum = parseInt(hour);

				// Valid combinations by day
				const validCombinations = {
					0: [48, 52, 56, 60, 64, 68], // Sunday
					1: [76, 80, 84, 88], // Monday
					2: [76, 80, 84, 88], // Tuesday
				};

				if (!validCombinations[dayOfWeek]) {
					const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
					return {
						valid: false,
						message: `Booking not available on ${dayNames[dayOfWeek]}. Available days: Monday, Tuesday, and Sunday.`,
					};
				}

				if (!validCombinations[dayOfWeek].includes(hourNum)) {
					const dayNames = ['Sunday', 'Monday', 'Tuesday'];
					return {
						valid: false,
						message: `Selected time not available for ${
							dayNames[dayOfWeek === 0 ? 0 : dayOfWeek === 1 ? 1 : 2]
						}. Please select a valid time slot.`,
					};
				}

				return { valid: true };
			}

			// Global pagination state
			let currentLogsPage = 1;
			const logsPerPage = 15;

			async function fetchLogs(page = 1) {
				try {
					const response = await fetch(`/logs?page=${page}&limit=${logsPerPage}`);
					const data = await response.json();

					if (data.logs) {
						document.getElementById('logs-content').textContent = data.logs.join('\n');
						updateLogsPagination(data.pagination);
						updateLogsInfo(data.pagination);
						currentLogsPage = page;
					} else {
						// Fallback for old API format
						document.getElementById('logs-content').textContent = data.join('\n');
						document.getElementById('logs-pagination-nav').style.display = 'none';
						document.getElementById('logs-info').textContent = `${data.length} logs`;
					}
				} catch (error) {
					console.error('Error fetching logs:', error);
					document.getElementById('logs-content').textContent = 'Error loading logs';
					document.getElementById('logs-info').textContent = 'Error loading logs';
				}
			}

			function updateLogsInfo(pagination) {
				const info = document.getElementById('logs-info');
				const start = (pagination.page - 1) * pagination.limit + 1;
				const end = Math.min(pagination.page * pagination.limit, pagination.totalCount);
				info.textContent = `Showing ${start}-${end} of ${pagination.totalCount} logs`;
			}

			function updateLogsPagination(pagination) {
				const nav = document.getElementById('logs-pagination-nav');
				const paginationList = document.getElementById('logs-pagination');

				if (pagination.totalPages <= 1) {
					nav.style.display = 'none';
					return;
				}

				nav.style.display = 'block';
				paginationList.innerHTML = '';

				// Previous button
				const prevLi = document.createElement('li');
				prevLi.className = `page-item ${!pagination.hasPrev ? 'disabled' : ''}`;
				prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToLogsPage(${
					pagination.page - 1
				}); return false;">Previous</a>`;
				paginationList.appendChild(prevLi);

				// Page numbers
				const startPage = Math.max(1, pagination.page - 2);
				const endPage = Math.min(pagination.totalPages, pagination.page + 2);

				if (startPage > 1) {
					const li = document.createElement('li');
					li.className = 'page-item';
					li.innerHTML = `<a class="page-link" href="#" onclick="goToLogsPage(1); return false;">1</a>`;
					paginationList.appendChild(li);

					if (startPage > 2) {
						const ellipsis = document.createElement('li');
						ellipsis.className = 'page-item disabled';
						ellipsis.innerHTML = '<span class="page-link">...</span>';
						paginationList.appendChild(ellipsis);
					}
				}

				for (let i = startPage; i <= endPage; i++) {
					const li = document.createElement('li');
					li.className = `page-item ${i === pagination.page ? 'active' : ''}`;
					li.innerHTML = `<a class="page-link" href="#" onclick="goToLogsPage(${i}); return false;">${i}</a>`;
					paginationList.appendChild(li);
				}

				if (endPage < pagination.totalPages) {
					if (endPage < pagination.totalPages - 1) {
						const ellipsis = document.createElement('li');
						ellipsis.className = 'page-item disabled';
						ellipsis.innerHTML = '<span class="page-link">...</span>';
						paginationList.appendChild(ellipsis);
					}

					const li = document.createElement('li');
					li.className = 'page-item';
					li.innerHTML = `<a class="page-link" href="#" onclick="goToLogsPage(${pagination.totalPages}); return false;">${pagination.totalPages}</a>`;
					paginationList.appendChild(li);
				}

				// Next button
				const nextLi = document.createElement('li');
				nextLi.className = `page-item ${!pagination.hasNext ? 'disabled' : ''}`;
				nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToLogsPage(${
					pagination.page + 1
				}); return false;">Next</a>`;
				paginationList.appendChild(nextLi);
			}

			function goToLogsPage(page) {
				if (page >= 1) {
					fetchLogs(page);
				}
			}

			function refreshLogs() {
				fetchLogs(currentLogsPage);
			}

			async function fetchTasks() {
				const response = await fetch('/tasks');
				const data = await response.json();
				const tasksList = document.getElementById('tasks-list');
				tasksList.innerHTML = '';
				(data.active || []).forEach((task) => {
					const listItem = document.createElement('li');
					listItem.className = 'list-group-item bg-secondary text-white mb-1';
					listItem.textContent = task;
					tasksList.appendChild(listItem);
				});
			}

			document.querySelectorAll('button[data-bs-toggle="tab"]').forEach((tab) => {
				tab.addEventListener('shown.bs.tab', (event) => {
					if (event.target.id === 'logs-tab') {
						fetchLogs();
					} else if (event.target.id === 'tasks-tab') {
						fetchTasks();
					}
				});
			});

			async function startTask() {
				const formData = new FormData(document.getElementById('control-form'));
				const data = Object.fromEntries(formData.entries());

				// Auto-generate emailInfo
				if (data.court && data.hour && hourToTime[data.hour]) {
					data.emailInfo = `Hall Tb ${data.court} at ${hourToTime[data.hour]}`;
				}

				// Validate booking day and time
				const validation = validateBooking(data.date, data.hour);
				if (!validation.valid) {
					showToast(validation.message, 'warning');
					return;
				}

				try {
					const response = await fetch('/start', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(data),
					});
					const result = await response.json();
					showToast(result.message, response.ok ? 'success' : 'danger');
				} catch (error) {
					showToast('Failed to start task.', 'danger');
				}
			}

			async function stopTask() {
				const taskKey = document.getElementById('taskKey').value;
				if (!taskKey) {
					showToast('Task Key is required to stop a task.', 'warning');
					return;
				}
				try {
					const response = await fetch('/stop', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ taskKey }),
					});
					const result = await response.json();
					showToast(result.message, 'success');
				} catch (error) {
					showToast('Failed to stop task.', 'danger');
				}
				fetchTasks();
			}

			async function testTask() {
				const formData = new FormData(document.getElementById('control-form'));
				const data = Object.fromEntries(formData.entries());

				// Auto-generate emailInfo
				if (data.court && data.hour && hourToTime[data.hour]) {
					data.emailInfo = `Hall Tb ${data.court} at ${hourToTime[data.hour]}`;
				}

				// Validate booking day and time
				const validation = validateBooking(data.date, data.hour);
				if (!validation.valid) {
					showToast(validation.message, 'warning');
					return;
				}

				try {
					const response = await fetch('/test', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(data),
					});
					const result = await response.json();
					showToast(result.message, response.ok ? 'info' : 'danger');
					fetchLogs();
				} catch (error) {
					showToast('Failed to test task.', 'danger');
				}
			}
		</script>
	</body>
</html>
