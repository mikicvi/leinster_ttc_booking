services:
    app:
        image: mikicv/leinster_ttc_booking:latest
        build: .
        ports:
            - '3037:3037'
        environment:
            - EMAIL=${EMAIL}
            - PASSWORD=${PASSWORD}
            - DIR=${DIR}
            - PORT=${PORT}
        volumes:
            # - .:/app
            - ./certs:/app/certs
            - ./data:/app/data
        command: npm start
